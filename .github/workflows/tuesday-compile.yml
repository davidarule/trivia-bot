name: Tuesday Trivia Compile
on:
  schedule:
    # 6pm Sydney = 07:00 UTC (AEDT summer) or 08:00 UTC (AEST winter)
    - cron: '0 7 * * 2'
    - cron: '0 8 * * 2'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/tuesday_compile.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_COMPILE: ${{ secrets.DISCORD_WEBHOOK_COMPILE }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DAILY_CHANNEL_ID: ${{ secrets.DISCORD_DAILY_CHANNEL_ID }}
