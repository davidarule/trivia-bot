name: Daily Trivia Intake
# Scheduled runs disabled — bot now triggered manually from local Mac (./daily.sh).
# This workflow is kept as a break-glass fallback: trigger via the Actions tab in
# GitHub if the Mac is unavailable. Tick force_run when triggering manually.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass Sydney day/hour guard (test fire)'
        type: boolean
        default: true

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/daily_intake.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          TRIVIA_FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
