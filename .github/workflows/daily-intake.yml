name: Daily Trivia Intake
on:
  schedule:
    - cron: '0 6 * * 1,3,5'
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass Sydney day/hour guard (test fire)'
        type: boolean
        default: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/daily_intake.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_DAILY: ${{ secrets.DISCORD_WEBHOOK_DAILY }}
          TRIVIA_FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
